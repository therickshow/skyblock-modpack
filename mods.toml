# Every mod in the pack, grouped by category (the README table follows this order).
# Libraries (Fabric API, Kotlin, config libs, ...) are pulled in automatically from each
# mod's declared dependencies. Don't list them here.
#
#   slug     Modrinth project slug: modrinth.com/mod/<slug> (or /resourcepack/<slug>)
#   why      One line for the README table
#   channel  Optional. "release" (default) = only take betas/alphas when a mod has no
#            release for this Minecraft version. "beta"/"alpha" = always take the newest
#            build up to that channel.
#   pin      Optional. Exact Modrinth version number to lock to (skips updates).
#
# After editing: run `python tools/modpack.py update`, then `build`.

# ─── SkyBlock: core ──────────────────────────────────────────────────────────────

[[mod]]
slug = "skyblocker-liap"
category = "SkyBlock: core"
why = "Dungeons (map, score, secret waypoints, puzzle + terminal solvers, Croesus), mining, slayers, Kuudra, Galatea, tab HUD, `/pv` profile viewer"

[[mod]]
slug = "skyhanni"
category = "SkyBlock: core"
why = "Garden and farming (visitors, pests, crop milestones), fishing, Diana, the Rift, Hoppity, Trevor. `/sh`"

[[mod]]
slug = "skyblock-enhanced-storage"
category = "SkyBlock: core"
why = "All Ender Chest + Backpack pages in one searchable screen"

[[mod]]
slug = "modern-warp-menu"
category = "SkyBlock: core"
why = "Clickable island map warp menu (Fancy Warp Menu port)"

[[mod]]
slug = "catharsis"
category = "SkyBlock: core"
why = "Lets SkyBlock texture packs retexture items (needed by modern Furfsky / Hypixel+ style packs)"

[[mod]]
slug = "scamscreener"
category = "SkyBlock: core"
why = "Flags likely scam messages in chat"

# ─── Dungeons & Kuudra ──────────────────────────────────────────────────────────

[[mod]]
slug = "odin"
category = "Dungeons & Kuudra"
why = "Dungeon boss timers (F6/F7), blood camp and blessing display, Kuudra HP and Fresh Tools timer. Only the parts Skyblocker doesn't do are switched on"

# ─── Recipes ────────────────────────────────────────────────────────────────────

[[mod]]
slug = "enhanced-skyrecipes"
category = "Recipes"
why = "SkyBlock-only recipe browser: 8,000+ items, crafting/forge recipes, mob drops, NPC shops, essence upgrades, reforges. No vanilla recipes cluttering it up like JEI had"

# ─── Vanilla QoL (only what SkyBlock needs) ──────────────────────────────────────

[[mod]]
slug = "modmenu"
category = "Vanilla QoL"
why = "Mods button with a config screen for everything in the pack"

[[mod]]
slug = "gamma-utils"
category = "Vanilla QoL"
why = "Fullbright for mining caves and dungeons: **G** toggles high gamma, **H** toggles client-side night vision"

[[mod]]
slug = "tooltip-scroll"
category = "Vanilla QoL"
why = "Scroll long SkyBlock tooltips that run off the screen"

# ─── Performance ────────────────────────────────────────────────────────────────

[[mod]]
slug = "sodium"
category = "Performance"
why = "Modern renderer, huge FPS boost"

[[mod]]
slug = "sodium-extra"
category = "Performance"
why = "Extra Sodium toggles (particles, animations, fog, FPS counter)"

[[mod]]
slug = "reeses-sodium-options"
category = "Performance"
why = "Cleaner tabbed video settings screen"

[[mod]]
slug = "lithium"
category = "Performance"
why = "Game-logic optimizations"

[[mod]]
slug = "ferrite-core"
category = "Performance"
why = "Lower memory usage"

[[mod]]
slug = "modernfix-mvus"
category = "Performance"
why = "Faster launch, lower memory, bug fixes (ModernFix fork that tracks new versions)"

[[mod]]
slug = "entityculling"
category = "Performance"
why = "Skips rendering entities/block entities you can't see (big win in crowded hubs)"

[[mod]]
slug = "moreculling"
category = "Performance"
why = "Additional block culling"

[[mod]]
slug = "immediatelyfast"
category = "Performance"
why = "Faster HUD, text and GUI rendering (lots of SkyBlock overlays)"

[[mod]]
slug = "dynamic-fps"
category = "Performance"
why = "Lowers FPS when the game is in the background or idle (AFK garden, alt-tab)"

# ─── Resource packs ─────────────────────────────────────────────────────────────
# Installed into resourcepacks/ and switched on by tools/configure.py ([resourcepacks] in
# settings.toml). Listed bottom to top.

[[resourcepack]]
slug = "clean-pvp-texturepack"
why = "Clean, minimal default edit (short swords, tidy tools and GUI), in the spirit of the ThirtyVirus pack"

[[resourcepack]]
slug = "skyblock-dark-ui"
why = "Dark, clean SkyBlock menus on top"
