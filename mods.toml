# Every mod in the pack, grouped by category (the README table follows this order).
# Libraries (Fabric API, Kotlin, config libs, ...) are pulled in automatically from each
# mod's declared dependencies. Don't list them here.
#
#   slug     Modrinth project slug: modrinth.com/mod/<slug>
#   why      One line for the README table
#   channel  Optional. "release" (default) = only take betas/alphas when a mod has no
#            release for this Minecraft version. "beta"/"alpha" = always take the newest
#            build up to that channel.
#   pin      Optional. Exact Modrinth version number to lock to (skips updates).
#
# After editing: run `python tools/modpack.py update`, then `build`.

# ─── SkyBlock: core ──────────────────────────────────────────────────────────────

[[mod]]
slug = "skyblocker-liap"
category = "SkyBlock: core"
why = "All-rounder: dungeon map & score, secret waypoints, puzzle + terminal solvers, Croesus profit, item prices, SkyBlock items/recipes in JEI"

[[mod]]
slug = "skyhanni"
category = "SkyBlock: core"
why = "Garden/farming overlays (crop milestones, visitor helper, money/hr, pests), plus slayer, mining, fishing, Diana and Rift features. `/sh`"

[[mod]]
slug = "skyblock-profile-viewer"
category = "SkyBlock: core"
why = "`/pv <player>`: full profile viewer, handy for party-finder checks"

[[mod]]
slug = "skyblock-enhanced-storage"
category = "SkyBlock: core"
why = "All Ender Chest + Backpack pages in one searchable screen"

[[mod]]
slug = "modern-warp-menu"
category = "SkyBlock: core"
why = "Clickable island map warp menu (Fancy Warp Menu port)"

[[mod]]
slug = "catharsis"
category = "SkyBlock: core"
why = "Lets SkyBlock texture packs retexture items (needed by modern Furfsky / Hypixel+ style packs)"

[[mod]]
slug = "scamscreener"
category = "SkyBlock: core"
why = "Flags likely scam messages in chat"

