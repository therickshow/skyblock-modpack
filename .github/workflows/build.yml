name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build .mrpack
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python tools/modpack.py build --version "${GITHUB_REF_NAME#v}"
          else
            python tools/modpack.py build
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mrpack
          path: dist/*.mrpack

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.mrpack --title "SkyBlock QoL $GITHUB_REF_NAME" --generate-notes
